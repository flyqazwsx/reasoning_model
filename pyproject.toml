[project]
name = "reasoning-model"
version = "0.1.0"
description = "Unsloth Thinking Model QLoRA 微調 Web 應用程式"
authors = [{name = "Josh Hu", email = "josh@example.com"}]
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    # 核心機器學習框架
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "datasets>=2.15.0",
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "accelerate>=0.25.0",
    "huggingface_hub>=0.25.0",
    "trl>=0.12.0",

    # Web 介面
    "gradio>=5.0.0",

    # 測試與開發工具
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "mypy>=1.7.0",

    # 其他實用工具
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"
markers = [
    "gpu: 需要 NVIDIA GPU 的測試（無 GPU 環境自動略過）",
    "e2e: 端對端測試（Playwright 操作 Gradio 畫面）",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
# 002 新增模組必須完整型別標註（憲章 II）；既有模組於修改時逐步補齊
module = [
    "src.services.hardware_service",
    "src.services.recommend_service",
    "src.services.adapter_service",
    "src.services.evaluation_service",
    "src.models.evaluation_result",
    "src.utils.response",
    "src.utils.think_parser",
]
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "D"]
ignore = ["D203", "D213", "D205", "D400", "D415"]

[tool.ruff.lint.per-file-ignores]
# 既有檔案尚未全面補 docstring，修改到該檔案時再移除對應項目
"tests/**" = ["D"]
"src/app.py" = ["D"]
"src/ui/**" = ["D"]
"src/lib/**" = ["D"]
"src/utils/checkpoint.py" = ["D"]
"src/utils/database_init.py" = ["D"]
"src/utils/gpu_monitor.py" = ["D"]
"src/utils/logger.py" = ["D"]
"src/utils/storage.py" = ["D"]
"src/services/dataset_service.py" = ["D"]
"src/services/inference_service.py" = ["D"]
"src/services/model_service.py" = ["D"]
"src/services/training_service.py" = ["D"]
"src/models/base_model.py" = ["D"]
"src/models/inference_record.py" = ["D"]
"src/models/lora_adapter.py" = ["D"]
"src/models/training_dataset.py" = ["D"]
"src/models/training_job.py" = ["D"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
